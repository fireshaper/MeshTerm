<!doctype html>
<html lang="en">
  <head>
    <!-- Cascade layer order, declared before any stylesheet loads. Themes live in `theme`. -->
    <style>
      @layer reset, base, theme, overrides;
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The server puts this response's CSP style nonce here (see apps/server/src/security.ts). -->
    <meta name="mt-csp-nonce" content="__MESHTERM_CSP_NONCE__" />
    <title>MeshTerm</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" data-mt="favicon" />
    <meta name="color-scheme" content="dark light" />
    <link id="mt-theme" rel="stylesheet" href="/themes/default/theme.css" data-mt="theme-link" />
    <!-- Applies the saved theme before the first paint (CR-004 §4.4); blocking on purpose. -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
