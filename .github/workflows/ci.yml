name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Unit tests
        run: pnpm test:unit
      - name: Integration tests
        run: pnpm test:int

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    # The official image (Node 24, browsers and fonts preinstalled) is also where the
    # Linux visual baselines are made (scripts/visual-baselines-linux.sh), so pixels match.
    # Keep its tag in step with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Playwright tests incl. visual baselines (builds server and SPA first)
        run: pnpm test:e2e
      - name: Base-app gate, three runs in a row
        run: pnpm test:gate
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14

  docker:
    name: Docker image (amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build runtime image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: false
          load: true
          tags: meshterm:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image size
        run: |
          docker image inspect meshterm:ci --format '{{.Size}}' | awk '{printf "uncompressed: %.1f MB\n", $1/1e6}'

  publish:
    name: Publish image to GHCR
    # Only images whose commit passed every check on main get published.
    needs: [checks, e2e, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The runtime stage's one RUN step executes per platform; QEMU covers arm64.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/meshterm
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
