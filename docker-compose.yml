# MeshTerm: one container, one volume. See README.md before exposing it.
services:
  meshterm:
    image: ghcr.io/fireshaper/meshterm:latest
    restart: unless-stopped
    ports: ["8080:8080"]
    # A named volume needs no host setup: Docker creates it owned by the container's
    # user (uid 1000). To keep the files in a host folder instead, use "./data:/data",
    # but create that folder first and give it to uid 1000:
    #   mkdir -p data && sudo chown 1000:1000 data
    volumes: ["meshterm-data:/data"]
    environment:
      - TZ=America/New_York
      # The Meshtastic node to connect to (Wi-Fi/Ethernet node or meshtasticd).
      - MESHTERM_NODE_HOST=192.168.1.50
      - MESHTERM_NODE_PORT=4403
      # MESHTERM_AUTH is planned (milestone M5); there is no login yet.

volumes:
  meshterm-data: {}
